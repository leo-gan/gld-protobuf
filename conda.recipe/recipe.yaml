# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
context:
  version: "0.5.0"

package:
  name: mojo-protobuf
  version: ${{ version }}

source:
  path: ..

build:
  number: 0
  script:
    - mkdir -p ${{ PREFIX }}/lib/mojo ${{ PREFIX }}/bin
    - mojo precompile -I src src/wire -o ${{ PREFIX }}/lib/mojo/wire.mojoc
    - mojo precompile -I src src/runtime -o ${{ PREFIX }}/lib/mojo/runtime.mojoc
    - mojo precompile -I src src/protobuf -o ${{ PREFIX }}/lib/mojo/protobuf.mojoc
    - mojo build -I src src/codegen/cli.mojo -o ${{ PREFIX }}/bin/gld-protoc-mojo

requirements:
  build:
    - mojo-compiler ==1.0.0
  host:
    - mojo-compiler ==1.0.0
  run:
    - ${{ pin_compatible('mojo-compiler') }}

tests:
  - script:
      - if: unix
        then:
          - mojo run test_import.mojo
          - gld-protoc-mojo --help
    files:
      recipe:
        - test_import.mojo

about:
  homepage: https://github.com/leo-gan/gld-protobuf
  repository: https://github.com/leo-gan/gld-protobuf
  license: MIT
  license_file: LICENSE
  summary: From-scratch Protocol Buffers library for Mojo
  description: |
    Runtime and code generator written in Mojo. Does not wrap libprotobuf
    or any other C, C++, or Rust protobuf library. The package installs
    protobuf.mojoc (plus wire/runtime) and the gld-protoc-mojo CLI.
  extra:
    maintainers:
      - leo-gan
    recipe-maintainers:
      - leo-gan
