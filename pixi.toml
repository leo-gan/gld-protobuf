[workspace]
name = "mojo-protobuf"
version = "0.7.0"
description = "From-scratch Protocol Buffers library for Mojo"
authors = ["Leonid Ganeline"]
channels = ["https://conda.modular.com/max", "conda-forge"]
platforms = ["linux-64"]

[dependencies]
mojo = "==1.1.0"

[tasks]
test = "bash scripts/run-tests.sh"
golden = "python3 scripts/gen_golden.py"
generate = "bash scripts/generate.sh"
precompile = "bash scripts/precompile.sh"
